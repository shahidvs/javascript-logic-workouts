<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>video player</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- video source -->
    <div class="player">
        <video class="player__video viewer" src="./video/Illuminati (Music Video) Sushin Shyam Dabzee Vinayak Sasikumar Think Originals.mp4" width="100%" height="500px"></video>
      <!-- controls -->
    <div class="player-controls">
     <div class="progress">
        <div class="progress__filled"></div>
    </div>
        
     <!-- silder -->
     <input type="range" name="volume" class="player__slider" min="0"
     max="1" step="0.05" value="1">
     <input type="range" name="playbackRate" class="player__slider" min="0.5"
     max="2" step="0.1" value="1">
     <!-- skip buttons -->
     <button data-skip="-10" class="player__button">⏮️10s</button>
     <!-- pause and play -->
     <button class="player__button toggle" title="Toggle Player">▶️</button>
     <button data-skip="25" class="player__button">25s⏩</button>

    </div>
    </div>

    <script src="./style.js"></script>
</body>
</html>
