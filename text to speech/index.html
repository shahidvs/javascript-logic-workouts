<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text to speech</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="voiceinator">
        <h1>The voiceinator 5000</h1>

    <select name="voice" id="voices">
        <option value="">select A Voice</option>
    </select>

    <label for="rate">Rate:</label>
    <input name="rate" type="range" min="0" max="3" value="1" step="0.1">

    <label for="pitch">pitch:</label>

    <input name="pitch" type="range" max="2" min="0" step="0.1">
    <textarea name="text">voice assistant👨‍🦰</textarea>
    <button id="stop">stop!</button>
    <button id="speak">speak</button>
    </div>

    <script>
        const msg = new SpeechSynthesisUtterance();
        let voices  =[];

        const voicesDropdown = document.querySelector('[name=voice]');
        const options = document.querySelectorAll('[type="range"],[name="text"]');
        const speakButtton = document.querySelector('#speak');
        const stopButton= document.querySelector('#stop');
        msg.text = document.querySelector('[name="text"]').value;
          
        // display different voice audios
        function populateVoices(){
            voices = this.getVoices();
            voicesDropdown.innerHTML = voices
            .filter(voice => voice.lang.includes('')) //we choose selective language
            .map(voice =>  `<option value="${voice.name}">${voice.name} (${voice.lang})</option>`)
            .join('');
            

        }


            // changing voices audios
            function setVoice(){
              msg.voice =voices.find(voice => voice.name === this.value) ;
              toggle();
            }


            // one voice start another one stop
            function toggle(startOver = true){
                speechSynthesis.cancel();
                if(startOver){
                    speechSynthesis.speak(msg);
                }
                
            }


            //pitch and rate
            function setOption(){
                console.log(this.name, this.value);
                msg[this.name] = this.value;
                toggle();
            }

            function speakUP(){
            toggle()
                
            }

            function stopped(){
                toggle(false)
            }




        speechSynthesis.addEventListener('voiceschanged',populateVoices);
        voicesDropdown.addEventListener('change',setVoice);
        options.forEach(option => option.addEventListener('change',setOption));
        speakButtton.addEventListener('click',speakUP)
        stopButton.addEventListener('click',stopped)

        

    </script>
</body>
</html>
