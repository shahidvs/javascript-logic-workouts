<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="one">
        <div class="two">
            <div class="three"> 

            </div>
        </div>
    </div>
    <button>click</button>



    <style>
       
        html{
            box-sizing: border-box;
        }

        *,*::before, *::after{box-sizing: inherit;}

        div{
            width: 100%;
            padding: 100px;

        }
            
        

        .one{
            background: thistle;
        }

        .two{
            background: mistyrose;
        }

        .three{
            background: coral;
        }
    </style>

<script>
    const divs = document.querySelectorAll('div');
    const button = document.querySelector('button')

    function logText(e) {
        console.log(this.classList.value);
        e.stopPropagation();
    }

    divs.forEach(div => div.addEventListener('click', logText, {
        capture: false, //when capture is true .click 3 it will show "one" (e.stopPropagation())
        once: true //when i click captured value shows onetime  
    })); 
  
    button.addEventListener('click',()=>{
        console.log('click');
    },{
        once: true
    })

</script>
</body>
</html>
