    <script>
        const needles = document.querySelectorAll('.needles');
        const speedDisplay = document.querySelector('.speeds')
        let =0;

function rotateNeedles(degrees) {
    needles.forEach(needle => {
        needle.style.transform = `rotate(${degrees}deg)`;
    });

   const speed = Math.floor(Math.random()*100);
    speedDisplay.textContent =speed;
}

setInterval(() => {
    rotateNeedles((Math.random() * 360)); // Random rotation between 0 and 360 degrees
}, 200); // Change rotation every 2000 milliseconds (2 seconds)


        
    </script>
