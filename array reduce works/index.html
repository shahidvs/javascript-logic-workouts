<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timestamp</title>
</head>
<body>
    <li data-time="2:02">
        video 1
    </li>
    <li data-time="2:10">
        video 2
    </li>
    <li data-time="4:02">
        video 3
    </li>
    <li data-time="5:02">
        video 4
    </li>
    <li data-time="6:02">
        video 5
    </li>
    <li data-time="7:02">
        video 6
    </li>
    <li data-time="8:02">
        video 7
    </li>
    <li data-time="0:47">
        video 8
    </li>
    <li data-time="10:02">
        video 9
    </li>
    <li data-time="11:03">
        video 10
    </li>
    <li data-time="14:02">
        video 11
    </li>

    <script>
        const timeNodes = Array.from(document.querySelectorAll('[data-time]'));

        const seconds = timeNodes
        .map(node => node.dataset.time).map(timeCode =>{
            const [mins,secs] =timeCode.split(':').map(parseFloat);
            return (mins * 60) + secs;
            

        })
        .reduce((total,vidSecs) => total + vidSecs);

        let secondsLeft = seconds;
        const hours = Math.floor(secondsLeft/3600);// 3600sec = 1hour the number of seconds in an hour
        secondsLeft = secondsLeft % 3600;

        const mins = Math.floor(secondsLeft/60);
        secondsLeft = secondsLeft % 60;

        console.log(hours,mins,secondsLeft);

    </script>

</body>
</html>
